[build-system]
requires = ["setuptools>=61", "wheel", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "euchre-ml"
version = "0.1.0"
description = "Fast C Euchre environments for machine-learning experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cffi>=1.15"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
